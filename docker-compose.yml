version: '3.8'

services:
  brain-react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-react
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - brain-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  brain-network:
    driver: bridge
